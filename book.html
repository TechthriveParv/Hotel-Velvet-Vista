<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Online Payment Page</title>

  <!-- Inner CSS -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    form .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .col {
      flex: 1 1 45%;
      min-width: 280px;
    }

    .title {
      font-size: 22px;
      color: #333;
      margin-bottom: 15px;
      padding-bottom: 5px;
      border-bottom: 2px solid #4facfe;
    }

    .inputBox {
      margin: 15px 0;
    }

    .inputBox label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
    }

    .inputBox input,
    .inputBox select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .inputBox input:focus,
    .inputBox select:focus {
      border-color: #4facfe;
      box-shadow: 0px 0px 6px rgba(79, 172, 254, 0.6);
    }

    .inputBox img {
      margin-top: 10px;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .flex {
      display: flex;
      gap: 15px;
    }

    .flex .inputBox {
      flex: 1;
    }

    .submit_btn {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .submit_btn:hover {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      transform: translateY(-2px);
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
    }

    /* Responsive */
    @media (max-width: 768px) {
      form .row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <form action="#">

      <div class="row">

        <!-- Billing Section -->
        <div class="col">
          <h3 class="title">Billing Address</h3>

          <div class="inputBox">
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
          </div>

          <div class="inputBox">
            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Enter email address" required>
          </div>

          <div class="inputBox">
            <label for="address">Address:</label>
            <input type="text" id="address" placeholder="Enter address" required>
          </div>

          <div class="inputBox">
            <label for="city">City:</label>
            <input type="text" id="city" placeholder="Enter city" required>
          </div>

          <div class="flex">
            <div class="inputBox">
              <label for="state">State:</label>
              <input type="text" id="state" placeholder="Enter state" required>
            </div>

            <div class="inputBox">
              <label for="zip">Pin Code:</label>
              <input type="number" id="zip" placeholder="123456" required>
            </div>
          </div>
        </div>

        <!-- Payment Section -->
        <div class="col">
          <h3 class="title">Payment</h3>

          <div class="inputBox">
            <label for="cardName">Cards Accepted:</label>
            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20240715140014/Online-Payment-Project.webp"
              alt="credit/debit card image">
          </div>

          <div class="inputBox">
            <label for="cardName">Name On Card:</label>
            <input type="text" id="cardName" placeholder="Enter card name" required>
          </div>

          <div class="inputBox">
            <label for="cardNum">Credit Card Number:</label>
            <input type="text" id="cardNum" placeholder="1111-2222-3333-4444" maxlength="19" required>
          </div>

          <div class="inputBox">
            <label for="expMonth">Exp Month:</label>
            <select id="expMonth" required>
              <option value="">Choose month</option>
              <option value="January">January</option>
              <option value="February">February</option>
              <option value="March">March</option>
              <option value="April">April</option>
              <option value="May">May</option>
              <option value="June">June</option>
              <option value="July">July</option>
              <option value="August">August</option>
              <option value="September">September</option>
              <option value="October">October</option>
              <option value="November">November</option>
              <option value="December">December</option>
            </select>
          </div>

          <div class="flex">
            <div class="inputBox">
              <label for="expYear">Exp Year:</label>
              <select id="expYear" required>
                <option value="">Choose Year</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
              </select>
            </div>

            <div class="inputBox">
              <label for="cvv">CVV</label>
              <input type="number" id="cvv" placeholder="123" required>
            </div>
          </div>
        </div>

      </div>

      <input type="submit" value="Proceed to Checkout" class="submit_btn">
    </form>
  </div>

  <script type="text/javascript" src="payment.js"></script>
</body>

</html>
