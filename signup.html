<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    form {
      border: 1px solid #ccc;
      background: #fff;
      padding: 25px 30px;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #333;
    }

    p {
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 20px 0;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #333;
    }

    input[type=text], input[type=password] {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f9f9f9;
      transition: 0.3s;
      font-size: 15px;
    }

    input[type=text]:focus, input[type=password]:focus {
      border-color: #04AA6D;
      background: #fff;
      outline: none;
      box-shadow: 0 0 6px rgba(4,170,109,0.2);
    }

    /* Buttons */
    button {
      border: none;
      padding: 14px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      width: 48%;
      transition: 0.3s;
    }

    .signupbtn {
      background-color: #04AA6D;
      color: white;
    }
    .signupbtn:hover {
      background-color: #039a62;
    }

    .cancelbtn {
      background-color: #f44336;
      color: white;
    }
    .cancelbtn:hover {
      background-color: #d6362b;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      font-size: 14px;
      color: #555;
    }

    .terms {
      font-size: 13px;
      text-align: center;
      margin: 15px 0;
    }

    .terms a {
      color: dodgerblue;
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    /* Button alignment */
    .clearfix {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }

    /* Responsive */
    @media screen and (max-width: 400px) {
      form {
        padding: 20px;
      }
      .clearfix {
        flex-direction: column;
      }
      .clearfix button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <form action="/action_page.php">
    <h1>Sign Up</h1>
    <p>Please fill in this form to create an account.</p>
    <hr>

    <label for="email">Email</label>
    <input type="text" placeholder="Enter Email" name="email" required>

    <label for="psw">Password</label>
    <input type="password" placeholder="Enter Password" name="psw" required>

    <label for="psw-repeat">Repeat Password</label>
    <input type="password" placeholder="Repeat Password" name="psw-repeat" required>

    <div class="checkbox-container">
      <input type="checkbox" checked="checked" name="remember">
      <label for="remember">Remember me</label>
    </div>

    <p class="terms">By creating an account you agree to our <a href="#">Terms & Privacy</a>.</p>

    <div class="clearfix">
      <button type="button" class="cancelbtn" onclick="location.href='index.html'">Cancel</button>
      <button type="submit" class="signupbtn">Sign Up</button>
    </div>
  </form>

</body>
</html>
